[package]
name = "mailbrus-server"
version = "0.1.0"
edition = "2021"
description = "HTTP server serving the SvelteKit frontend and JSON API over mailbrus-core"
license = "LGPL-3.0-or-later"

[[bin]]
name = "mailbrus-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
mail-parser = "0.11"
mailbrus-core = { path = "../mailbrus-core", features = ["sync"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
open = "5"
ammonia = "4"
html2text = "0.12"
lol_html = "2"
