name: "Publish tags to FlakeHub"
on:
  push:
    tags:
      - "v?[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing tag to publish to FlakeHub"
        type: "string"
        required: true
jobs:
  flakehub-publish:
    runs-on: "ubuntu-latest"
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - uses: "actions/checkout@v6"
        with:
          persist-credentials: false
          # On workflow_dispatch check out the requested tag; on a tag push use
          # the ref that triggered the run.
          ref: "${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}"
      - uses: "DeterminateSystems/determinate-nix-action@v3"

      # Fail fast, with a readable error, before handing off to flakehub-push.
      #
      # flakehub-push evaluates every output for every advertised system. When
      # one refuses to evaluate, the failure arrives as a wall of nested Nix
      # traces from inside the action — which is how the webkitgtk-broken-on-
      # darwin failure went undiagnosed for two months.
      #
      # `--all-systems` is the load-bearing flag: the original failure was in a
      # darwin output evaluated from Linux. `nix flake show` is NOT a substitute
      # — it does not force derivation inputs, so it passed throughout.
      - name: "Check every flake output evaluates"
        run: "nix flake check --no-build --all-systems"

      # Pinned to a commit SHA rather than a mutable tag: this job holds
      # `id-token: write`, so a moving ref would be an unreviewed change with
      # access to an OIDC token.
      - uses: "DeterminateSystems/flakehub-push@71f57208810a5d299fc6545350981de98fdbc860" # v6
        with:
          visibility: "public"
          name: "antono/mailbrus"
          # `inputs.tag` is null on a tag push, so fall back to the pushed ref's
          # name instead of passing an empty string.
          tag: "${{ inputs.tag || github.ref_name }}"
          include-output-paths: true
