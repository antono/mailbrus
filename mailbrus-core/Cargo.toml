[package]
name = "mailbrus-core"
version = "0.1.0"
edition = "2021"
description = "Shared core library for mailbrus"
license = "LGPL-3.0-or-later"

[features]
default = []
sync = [
    "dep:imap-client",
    "dep:io-maildir",
    "dep:sha2",
    "dep:keyring",
    "dep:prs-lib",
    "dep:rusqlite",
    "dep:toml",
    "dep:serde",
    "dep:tokio",
    "dep:tracing",
    "dep:thiserror",
    "dep:async-trait",
    "dep:chrono",
    "dep:tokio-rustls",
    "dep:rustls-platform-verifier",
    "dep:base64",
]

[dependencies]
notmuch = "0.8"
dirs = "5"

# sync feature deps
imap-client = { git = "https://github.com/pimalaya/imap-client", optional = true }
# Maildir delivery protocol (tmp -> atomic rename) and flag renames. `client` is
# the blocking std client; we drive it from spawn_blocking. Adds only
# gethostname, log and thiserror to the tree.
io-maildir = { version = "0.3", default-features = false, features = ["client"], optional = true }
# Content revision hashing. Already compiled under `sync` via imap-client and
# secret-service, so declaring it directly costs no new tree entry.
sha2 = { version = "0.10", optional = true }
# Direct dependency on `keyring` 3.x. The feature set reproduces what the former
# `keyring-lib` wrapper selected on our behalf: native store per platform, the
# tokio-flavoured zbus backend, and the pure-Rust crypto backend.
keyring = { version = "3", default-features = false, features = [
    "linux-native-async-persistent",
    "apple-native",
    "windows-native",
    "tokio",
    "crypto-rust",
], optional = true }
prs-lib = { version = "0.5.7", default-features = false, features = ["backend-gnupg-bin"], optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
toml = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "net", "time", "io-util"], optional = true }
tokio-rustls = { version = "0.26", optional = true }
rustls-platform-verifier = { version = "0.6", optional = true }
base64 = { version = "0.22", optional = true }
tracing = { version = "0.1", optional = true }
thiserror = { version = "2", optional = true }
async-trait = { version = "0.1", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"], optional = true }

[dev-dependencies]
tempfile = "3"
