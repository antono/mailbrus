[package]
name = "mailbrus-desktop"
version = "0.1.0"
edition = "2021"
description = "mailbrus: keyboard-oriented email client (desktop)"
license = "LGPL-3.0-or-later"

[lib]
name = "mailbrus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.0", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mailbrus-core = { path = "../mailbrus-core" }
