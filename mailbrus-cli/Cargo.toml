[package]
name = "mailbrus-cli"
version = "0.1.0"
edition = "2021"
description = "mailbrus: keyboard-oriented email client (CLI)"
license = "LGPL-3.0-or-later"

[[bin]]
name = "mailbrus"
path = "src/main.rs"

[dependencies]
mailbrus-core = { path = "../mailbrus-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toon-format = "0.4"
