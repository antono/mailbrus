schema: spec-driven
# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
context: |
  Tech stack: Rust, SvelteKit, Tauri, Pimalaya libs for email
  Domain: email client cli tui and gui
# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
rules:
  proposal:
    - Keep proposals under 500 words
    - Always include a "Non-goals" section
  design:
    - Use mermaid skill to draw diagrams (when needed)
    - Ensure e2e test exist for each ui feature
  tasks:
    - At the end of task list add e2e test validation and fixes cycle
